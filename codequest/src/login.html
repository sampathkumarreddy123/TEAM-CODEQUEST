<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CodeQuest</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-base: whitesmoke;
            --bg-surface: white;
            --bg-muted: whitesmoke;
            --border-light: #e5e5e5;
            --border-medium: #d4d4d4;
            --text-primary: #171717;
            --text-secondary: #525252;
            --text-muted: #737373;
            --primary-btn: #1f2937;
            --primary-btn-hover: #111827;
            --accent-btn: #2563eb;
            --accent-btn-hover: #1d4ed8;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background-color: var(--bg-base);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 42px 36px;
            box-shadow: 0 10px 25px #e5e5e5, 0 1px 3px #d4d4d4;
            text-align: center;
        }

        .brand-header {
            margin-bottom: 28px;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 10px 24px;
            border-radius: 999px;
            gap: 12px;
            box-shadow: 0 4px 12px #e5e5e5;
        }

        .logo-container img {
            height: 38px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #111827;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .actions-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-github {
            background-color: #24292f;
            color: white;
            border: 1px solid #24292f;
        }

        .btn-github:hover {
            background-color: #000000;
            box-shadow: 0 4px 12px #d4d4d4;
        }

        .btn-github i {
            font-size: 1.25rem;
        }

        .btn-guest {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: 1px solid #1d4ed8;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
        }

        .btn-guest:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        .btn-guest i {
            font-size: 1.15rem;
        }

        .divider-or {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 4px 0;
            color: var(--text-muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .divider-or::before, .divider-or::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-light);
        }

        .divider-or span {
            padding: 0 10px;
        }
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .features-pill-row span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .features-pill-row i {
            color: #2563eb;
        }

        .alert-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            margin-bottom: 16px;
            display: none;
            text-align: left;
        }

        /* ---------------- Tablet & Mobile Responsive ---------------- */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .login-wrapper {
                padding: 30px 20px;
                border-radius: var(--radius-md);
            }
            .logo-container {
                padding: 8px 16px;
            }
            .brand-name {
                font-size: 1.05rem;
            }
            h1 {
                font-size: 1.4rem;
            }
            .subtitle {
                font-size: 0.88rem;
            }
            .btn-github {
                padding: 13px;
                font-size: 0.95rem;
            }
            .features-pill-row {
                flex-direction: column;
                gap: 8px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand-header">
            <div class="logo-container">
                <img src="assets/codequest_logo.png" alt="CodeQuest Logo" onerror="this.style.display='none'">
                <span class="brand-name">CODEQUEST</span>
            </div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Join our developer community to ask questions, solve programming bugs, and share knowledge.</p>
        </div>

        <div id="errorAlert" class="alert-error">
            <i class="fa-solid fa-circle-exclamation me-1"></i> <span id="errorMessage">Authentication failed. Please try again.</span>
        </div>

        <div class="actions-section">
            <button class="btn btn-github" id="githubLoginBtn" onclick="githubLogin()">
                <i class="fa-brands fa-github"></i>
                <span>Continue with GitHub</span>
            </button>
            <div class="divider-or"><span>or test calling with 2nd account</span></div>
            <button class="btn btn-guest" id="guestLoginBtn" onclick="guestLogin()">
                <i class="fa-solid fa-user-astronaut"></i>
                <span>Sign in as Guest Developer (Test 1-on-1 Calls)</span>
            </button>
        </div>

        <div class="features-pill-row">
            <span><i class="fa-solid fa-comments"></i> Developer Q&A</span>
            <span><i class="fa-solid fa-thumbs-up"></i> Upvoting</span>
            <span><i class="fa-solid fa-video"></i> Live 1-on-1 Calls</span>
        </div>
    </div>

    <script>
        async function checkAlreadyLoggedIn() {
            try {
                const res = await fetch('/auth/status');
                const data = await res.json();
                if (data.loggedIn) {
                    window.location.href = '/dashboard.html';
                }
            } catch (e) {
                console.log('Auth check error:', e);
            }
        }
        checkAlreadyLoggedIn();

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            const errType = urlParams.get('error');
            const msg = urlParams.get('msg');
            if (msg) {
                errorMessage.textContent = decodeURIComponent(msg);
            } else if (errType === 'github_auth_failed' || errType === 'github_token_failed') {
                errorMessage.textContent = 'GitHub authorization could not be completed. Please try again.';
            } else if (errType === 'missing_code') {
                errorMessage.textContent = 'GitHub login was cancelled. Please try again.';
            }
            errorAlert.style.display = 'block';
        }

        function githubLogin() {
            const btn = document.getElementById('githubLoginBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting to GitHub...';
            btn.style.pointerEvents = 'none';
            window.location.href = '/auth/github';
        }

        async function guestLogin() {
            const btn = document.getElementById('guestLoginBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Setting up test account...';
            btn.style.pointerEvents = 'none';
            try {
                const res = await fetch('/auth/guest-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include'
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard.html';
                } else {
                    alert('Guest login failed: ' + (data.error || 'Unknown error'));
                    btn.innerHTML = '<i class="fa-solid fa-user-astronaut"></i> <span>Sign in as Guest Developer (Test 1-on-1 Calls)</span>';
                    btn.style.pointerEvents = 'auto';
                }
            } catch (e) {
                alert('Connection error: ' + e.message);
                btn.innerHTML = '<i class="fa-solid fa-user-astronaut"></i> <span>Sign in as Guest Developer (Test 1-on-1 Calls)</span>';
                btn.style.pointerEvents = 'auto';
            }
        }
    </script>
</body>
</html>
