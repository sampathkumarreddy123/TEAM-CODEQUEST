<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - CodeQuest</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="app-header">
        <div class="header-left">
            <a href="dashboard.html" class="brand-link" title="CodeQuest Home">
                <img src="assets/codequest_logo.png" class="brand-logo" alt="CodeQuest Logo" onerror="this.style.display='none'">
                <span class="brand-title">CODEQUEST</span>
            </a>
        </div>

        <div class="header-right">
            <button id="backBtn" class="btn btn-back">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </button>
            <button id="logoutBtn" class="btn btn-outline-danger btn-logout" title="Sign out">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </header>

    <!-- Main Profile Content -->
    <main class="main-layout">
        <div class="profile-wrapper">
            <!-- Profile Hero Card -->
            <div class="profile-card">
                <div class="profile-header-content">
                    <div class="avatar-wrap">
                        <img id="profileAvatar" src="default-avatar.png" class="profile-avatar" alt="Avatar" onerror="this.src='default-avatar.png'">
                    </div>
                    <div class="profile-meta">
                        <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                            <h1 id="profileUsername" class="profile-name">Loading...</h1>
                            <span id="profileRoleBadge" class="profile-badge">Community Member</span>
                        </div>
                        <p id="profileJoinDate" class="profile-subtext">Member since ...</p>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon-wrap"><i class="fa-solid fa-circle-question"></i></div>
                        <div class="stat-info">
                            <span id="statQuestionsCount" class="stat-value">0</span>
                            <span class="stat-label">Questions Asked</span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon-wrap stat-icon-answers"><i class="fa-solid fa-comments"></i></div>
                        <div class="stat-info">
                            <span id="statAnswersCount" class="stat-value">0</span>
                            <span class="stat-label">Answers Provided</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Activity Section: User Questions -->
            <div class="activity-section">
                <div class="activity-header">
                    <h2 class="activity-title" id="activityTitle">Questions by User</h2>
                    <span id="activityCountBadge" class="activity-count">0 items</span>
                </div>

                <div id="userQuestionsContainer" class="user-questions-list">
                    <div class="loading-state">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                        <p>Loading activity...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="profile.js"></script>
</body>
</html>
