<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>User Profile - CodeQuest</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="codequest-features.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="app-header">
        <div class="header-left">
            <a href="dashboard.html" class="brand-link" title="CodeQuest Home">
                <div class="brand-icon-box">
                    <img src="assets/codequest_logo.png" class="brand-logo" alt="CodeQuest Logo" onerror="this.onerror=null; this.src='assets/logo.png';">
                </div>
                <span class="brand-title">CODEQUEST</span>
            </a>
        </div>

        <div class="header-right">
            <!-- Personal Code Vault Button -->
            <button id="codeVaultBtn" class="btn btn-vault-nav me-2" title="My Saved Code Snippets">
                <i class="fa-solid fa-box-archive"></i>
                <span class="d-none d-md-inline">Vault</span>
                <span class="vault-badge-count" id="vaultCountBadge" style="display: none;">0</span>
            </button>

            <button id="backBtn" class="btn btn-back">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </button>
            <button id="logoutBtn" class="btn btn-outline-danger btn-logout" title="Sign out">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </header>

    <!-- Main Profile Content -->
    <main class="main-layout">
        <div class="profile-wrapper">
            <!-- Profile Hero Card -->
            <div class="profile-card">
                <div class="profile-header-content">
                    <div class="avatar-wrap">
                        <img id="profileAvatar" src="default-avatar.png" class="profile-avatar" alt="Avatar" onerror="this.src='default-avatar.png'">
                    </div>
                    <div class="profile-meta">
                        <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                            <h1 id="profileUsername" class="profile-name">Loading...</h1>
                            <span id="profileRoleBadge" class="profile-badge">Community Member</span>
                            <span id="profileAdminBadge" class="badge-admin-tag" style="display: none;"><i class="fa-solid fa-shield-halved"></i> Administrator</span>
                        </div>
                        <p id="profileJoinDate" class="profile-subtext">Member since ...</p>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon-wrap"><i class="fa-solid fa-circle-question"></i></div>
                        <div class="stat-info">
                            <span id="statQuestionsCount" class="stat-value">0</span>
                            <span class="stat-label">Questions Asked</span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon-wrap stat-icon-answers"><i class="fa-solid fa-comments"></i></div>
                        <div class="stat-info">
                            <span id="statAnswersCount" class="stat-value">0</span>
                            <span class="stat-label">Answers Provided</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quest Gamification & Achievements Section -->
            <div id="questGamificationContainer" class="mt-4">
                <!-- Populated dynamically via window.CodeQuestPro.renderQuestGamification -->
            </div>

            <!-- Activity Section: User Questions & Answers -->
            <div class="activity-section">
                <div class="activity-header">
                    <div class="activity-tabs">
                        <button id="tabQuestionsBtn" class="activity-tab-btn active" type="button"><i class="fa-solid fa-circle-question me-1"></i> Questions (<span id="tabQuestionsCount">0</span>)</button>
                        <button id="tabAnswersBtn" class="activity-tab-btn" type="button"><i class="fa-solid fa-comments me-1"></i> Answers (<span id="tabAnswersCount">0</span>)</button>
                    </div>
                </div>

                <div id="userActivityContainer" class="user-questions-list">
                    <div class="loading-state">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                        <p>Loading activity...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Profile Picture Lightbox Modal -->
    <div id="avatarLightbox" class="avatar-lightbox" style="display: none;" role="dialog" aria-modal="true">
        <div class="avatar-lightbox-backdrop"></div>
        <button id="avatarLightboxClose" class="avatar-lightbox-close" title="Close (or press Esc)" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="avatar-lightbox-content">
            <div class="avatar-lightbox-img-wrap">
                <img id="avatarLightboxImg" src="" alt="Profile Picture" class="avatar-lightbox-img" title="Click picture to zoom in/out">
            </div>
            <div id="avatarLightboxCaption" class="avatar-lightbox-caption"></div>
            <div id="avatarLightboxHint" class="avatar-lightbox-hint"><i class="fa-solid fa-magnifying-glass-plus me-1"></i>Click picture to zoom in</div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle & Features -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="codequest-features.js?v=2.3.0"></script>
    <script src="profile.js?v=2.3.0"></script>
</body>
</html>
