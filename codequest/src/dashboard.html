<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CodeQuest Developer Community</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="app-header">
        <div class="header-left">
            <a href="dashboard.html" class="brand-link" title="CodeQuest Home">
                <div class="brand-icon-box">
                    <img src="assets/codequest_logo.png" class="brand-logo" alt="CodeQuest Logo" onerror="this.onerror=null; this.src='assets/logo.png';">
                </div>
                <span class="brand-title">CODEQUEST</span>
            </a>
        </div>

        <div class="header-center">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search questions, topics, bugs..." autocomplete="off">
                <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" style="display: none;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <div class="header-right">
            <button id="openAskModalBtn" class="btn btn-primary-cq">
                <i class="fa-solid fa-plus"></i>
                <span>Ask Question</span>
            </button>

            <!-- User Menu Dropdown (Clean, replaces standalone red logout button) -->
            <div class="dropdown">
                <button class="user-chip-btn dropdown-toggle" type="button" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <img id="headerUserAvatar" src="default-avatar.png" alt="Avatar" class="user-avatar-sm" onerror="this.src='default-avatar.png'">
                    <span id="headerUsername" class="user-name-text">Developer</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end cq-dropdown" aria-labelledby="userMenuDropdown">
                    <li><a class="dropdown-item" href="profile.html"><i class="fa-solid fa-user me-2"></i> My Profile</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><button class="dropdown-item text-danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket me-2"></i> Sign Out</button></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-layout">
        <div class="feed-container">

            <!-- Feed Tabs Header -->
            <div class="feed-tabs-header">
                <div class="feed-tabs">
                    <button class="tab-btn active" data-tab="latest"><i class="fa-solid fa-clock me-1"></i> Latest</button>
                    <button class="tab-btn" data-tab="popular"><i class="fa-solid fa-fire me-1"></i> Popular</button>
                    <button class="tab-btn" data-tab="unanswered"><i class="fa-solid fa-comment-slash me-1"></i> Unanswered</button>
                    <button class="tab-btn" data-tab="solved"><i class="fa-solid fa-circle-check me-1 text-success"></i> Solved</button>
                </div>
                <div class="feed-meta-info">
                    <span id="questionCountBadge" class="count-badge">0 questions</span>
                </div>
            </div>

            <!-- Quick Question Input Bar -->
            <div class="quick-ask-card">
                <img id="quickAskAvatar" src="default-avatar.png" class="user-avatar-sm" alt="User" onerror="this.src='default-avatar.png'">
                <div class="quick-ask-input-wrap">
                    <input type="text" id="quickAskInput" placeholder="Got a coding question? Type here (e.g. How to use promises? #javascript)..." />
                    <button id="quickAskBtn" class="btn-quick-post">
                        <i class="fa-solid fa-paper-plane"></i> Post
                    </button>
                </div>
            </div>

            <!-- Active Search / Tag Pill -->
            <div id="searchFilterPill" class="search-pill" style="display: none;">
                <span>Filtering by: <b id="activeSearchQuery"></b></span>
                <button id="removeFilterBtn" title="Clear filter"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Questions List -->
            <div id="messagesContainer" class="messages-container">
                <div class="loading-state">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <p>Loading questions...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Ask Question Modal (Rich question form with code & tags) -->
    <div class="modal fade" id="askQuestionModal" tabindex="-1" aria-labelledby="askModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content cq-modal">
                <div class="modal-header">
                    <h5 class="modal-title" id="askModalLabel"><i class="fa-solid fa-circle-question text-primary me-2"></i>Ask a Question</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label fw-bold">Question Details</label>
                    <div class="formatting-toolbar mb-2">
                        <button type="button" class="btn-fmt" data-target="modalQuestionText" data-fmt="code-block" title="Insert Code Block"><i class="fa-solid fa-code me-1"></i>Code Block</button>
                        <button type="button" class="btn-fmt" data-target="modalQuestionText" data-fmt="code-inline" title="Insert Inline Code"><i class="fa-solid fa-terminal me-1"></i>Inline</button>
                        <button type="button" class="btn-fmt" data-target="modalQuestionText" data-fmt="bold" title="Insert Bold"><i class="fa-solid fa-bold me-1"></i>Bold</button>
                    </div>
                    <textarea id="modalQuestionText" class="form-control cq-textarea" rows="4" placeholder="Explain your problem or question... You can use `code` or ```code blocks```"></textarea>
                    
                    <label class="form-label fw-bold mt-3">Tags / Categories (Optional)</label>
                    <input type="text" id="modalQuestionTags" class="form-control cq-input" placeholder="e.g. javascript, react, mongodb (comma separated)" />
                    <div class="form-text text-muted">Add up to 5 tags to help others find and answer your question.</div>

                    <div id="modalErrorMsg" class="text-danger mt-2" style="display: none; font-size: 0.88rem;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="modalSubmitBtn" class="btn btn-primary-cq">
                        <i class="fa-solid fa-plus"></i> Post Question
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Auth Prompt Modal (Clean prompt for guest users) -->
    <div class="modal fade" id="authPromptModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content cq-modal text-center p-3">
                <div class="modal-body">
                    <div class="auth-prompt-icon mb-3">
                        <i class="fa-brands fa-github fa-3x" style="color: #24292f;"></i>
                    </div>
                    <h5 class="fw-bold mb-2">GitHub Login Required</h5>
                    <p class="text-muted small mb-4" id="authPromptMsg">Please sign in with your GitHub account to continue.</p>
                    <a href="login.html" class="btn btn-primary-cq w-100 mb-2">
                        <i class="fa-brands fa-github me-2"></i> Continue with GitHub
                    </a>
                    <button type="button" class="btn btn-outline-secondary btn-sm w-100" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification for Share / Copy -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Link copied to clipboard!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Profile Picture Lightbox Modal -->
    <div id="avatarLightbox" class="avatar-lightbox" style="display: none;">
        <div class="avatar-lightbox-backdrop"></div>
        <div class="avatar-lightbox-content">
            <button id="avatarLightboxClose" class="avatar-lightbox-close" title="Close (or click anywhere)">&times;</button>
            <img id="avatarLightboxImg" src="" alt="Profile Picture" class="avatar-lightbox-img">
            <div id="avatarLightboxCaption" class="avatar-lightbox-caption"></div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="questions.js"></script>
</body>
</html>
